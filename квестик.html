<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учительский квест ❤️</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f0ff,#eef8ff);color:#222;min-height:100vh}main{max-width:560px;margin:auto;padding:22px 16px 36px}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px #0001}.center{text-align:center}.emoji{font-size:52px}.tag{display:inline-block;background:#eee8ff;color:#5b43c7;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}h1{font-size:30px;margin:10px 0}h2{font-size:22px;line-height:1.3;margin:15px 0 20px}p{line-height:1.55}.muted{color:#707078}button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:15px;background:#f1f0f5;font-size:16px;text-align:left;cursor:pointer}.primary{background:#7658e8;color:white;text-align:center;font-weight:700}.progress{height:7px;background:#e7e6ec;border-radius:99px;margin-bottom:20px;overflow:hidden}.bar{height:100%;background:#7658e8;transition:.2s}.final{font-size:17px;line-height:1.7}</style></head><body><main><div class="card" id="app"></div></main><script>
const questions=[
['РАЗМИНКА','Что учитель чаще всего говорит классу?',['«Так, тишина!»','«Открываем тетради»','«Я всё вижу»','«Ну что, поехали…»']],
['ШКОЛЬНАЯ ЖИЗНЬ','Ученик говорит: «Я забыл домашку». Какая реакция знакома учителю?',['«Конечно, случайно забыл»','Глубокий вдох','«А я вчера что говорила?»','Все варианты одновременно']],
['ПРОФЕССИОНАЛЬНОЕ','Что обычно происходит после фразы «Можно один вопрос?»',['Один вопрос — и всё','Появляется ещё пять вопросов','Урок официально продлён','Учитель уже знает, что это надолго']],
['🇬🇧 МАМИН ВОПРОС','Какая фраза особенно подходит учителю английского?',['Open your books','Repeat after me','Speak English, please','No Russian, please!']],
['🛡️ ПАПИН ВОПРОС','Ученик на ОБЗР спрашивает: «А это вообще когда-нибудь пригодится?» Что отвечает опытный учитель?',['«Очень надеюсь, что не пригодится»','«Для контрольной пригодится точно»','«Лучше знать заранее, чем потом жалеть»','«Запиши — потом обсудим»']],
['❤️ ФИНАЛ','Кем являются эти два учителя дома?',['Просто учителями','Главными проверяющими','Мамой и папой ❤️','Людьми, которые тоже иногда хотят каникулы']]
];let i=0;const app=document.getElementById('app');function start(){i=0;show()}function show(){const q=questions[i];app.innerHTML='<div class="progress"><div class="bar" style="width:'+(i/questions.length*100)+'%"></div></div><span class="tag">'+q[0]+'</span><h2>'+q[1]+'</h2><div id="answers"></div><p class="muted" style="font-size:13px">Вопрос '+(i+1)+' из '+questions.length+'</p>';q[2].forEach(a=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{i++;i<questions.length?show():finish()};document.getElementById('answers').appendChild(b)})}function finish(){app.innerHTML='<div class="center"><div class="emoji">🏆</div><h1>АТТЕСТАЦИЯ<br>ПРОЙДЕНА!</h1></div><div class="final"><p><b>Дорогие родители!</b></p><p>Поздравляю вас с вашим профессиональным праздником — <b>Днём учителя!</b> ❤️</p><p>Спасибо вам за ваш труд, терпение, знания и за то, что каждый день вы помогаете своим ученикам становиться лучше.</p><p>Пусть работа приносит вам радость, ученики радуют своими успехами, а в жизни всегда будет время для отдыха, улыбок и приятных моментов.</p><p>А для меня вы не только учителя — вы мои <b>любимые мама и папа</b>. Я очень вас люблю и горжусь вами! ❤️</p><p><b>С Днём учителя! 🌷</b></p></div><button class="primary" onclick="start()">Пройти ещё раз</button>'}app.innerHTML='<div class="center"><div class="emoji">👩‍🏫👨‍🏫</div><h1>Учительский квест</h1><p>Небольшая проверка профессиональной выдержки для двух педагогов. Особое задание ждёт учителя английского и учителя ОБЗР 😉</p><button class="primary" onclick="start()">Начать квест →</button></div>';
</script></body></html>
